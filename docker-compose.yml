version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: radiology-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: radiology
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - radiology-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: radiology-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=radiology
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/radiology?schema=public
      - JWT_SECRET=your_jwt_secret_key_change_in_production
      - JWT_EXPIRATION=1d
      - JWT_REFRESH_EXPIRATION=7d
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
      - ./packages/backend/uploads:/app/uploads
    networks:
      - radiology-network
    command: >
      sh -c "mkdir -p /app/uploads && 
             npx prisma migrate dev --name init --skip-seed && 
             npx prisma generate && 
             npx prisma db seed && 
             npm run start:dev"

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: radiology-frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000/api
      - NEXT_PUBLIC_APP_NAME=Radiology SaaS Platform
      - NEXT_PUBLIC_APP_DESCRIPTION=A multi-tenant SaaS platform for radiology centers and hospitals
    ports:
      - "56440:56440"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    networks:
      - radiology-network
    command: npm run dev

networks:
  radiology-network:
    driver: bridge

volumes:
  postgres_data: