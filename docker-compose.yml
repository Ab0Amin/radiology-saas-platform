version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: radiology-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: radiology
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - radiology-network

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: radiology-backend
    depends_on:
      - postgres
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=radiology
      - JWT_SECRET=your_jwt_secret_key_change_in_production
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    networks:
      - radiology-network
    command: npm run start:dev

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: radiology-frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000
    ports:
      - "56440:56440"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    networks:
      - radiology-network
    command: npm run dev

networks:
  radiology-network:
    driver: bridge

volumes:
  postgres_data: